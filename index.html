function rirNum(v){
  const s=String(v??"").trim().toLowerCase().replace(/,/g,".");if(!s)return null;
  if(/^3\s*\+$/.test(s)||/изи|легк|easy/.test(s))return 4;if(/отказ/.test(s))return 0;
  const m=s.match(/^(\d+(?:\.\d+)?)\s*(?:[-–—]\s*(\d+(?:\.\d+)?))?\s*\+?$/);if(!m)return null;
  return m[2]!=null?(+m[1]+ +m[2])/2:+m[1];
}

/* ---------- Прогрессия ---------- */
/* Двойная прогрессия по подходам: каждый подход сравнивается с тем же подходом прошлой тренировки.
   - ниже верха диапазона → тот же вес, +1 повтор (в прошлый раз RIR 3+ → +2);
   - дошёл до верха → вес + step, повторы — по оценке силы (формула Эпли) из этого и следующих подходов с запасом 2, не выше верха;
   - в прошлый раз отказ (RIR 0) → повторить то же;
   - у упражнений с res (жим ногами, румынская тяга) запас сдвигается на res−1: повторить то же при RIR ≤ res−1, +2 повтора при RIR ≥ res+2, новый вес считается с запасом res+1;
   - время (планки) → +step сек до верха диапазона, дальше «усложни».
   Основа: ACSM 2009 (+2–10% веса, когда делаешь на 1–2 повтора больше нужного), Plotkin и др. 2022 (прибавка повторов работает как прибавка веса). */
function lastFor(key,skipId){
  const s=sorted();let end=s.length;
  if(skipId){const j=s.findIndex(w=>w.id===skipId);if(j>=0)end=j} // при редактировании — только то, что было до этой тренировки
  for(let i=end-1;i>=0;i--){const e=(s[i].entries||[]).find(e=>e.ex===key&&(e.sets||[]).some(x=>num(x.reps)!=null));if(e)return{w:s[i],e,i,s}}
  return null;
}
function olderSet(key,s,before,idx,kg){ // повторы не записаны — берём тот же вес из более ранней тренировки
  const ok=x=>x&&num(x.reps)!=null&&(EX[key].time||num(x.kg)===kg);
  for(let i=before-1;i>=0;i--){const e=(s[i].entries||[]).find(e=>e.ex===key);if(!e)continue;const h=ok(e.sets[idx])?e.sets[idx]:e.sets.find(ok);if(h)return{...h,date:s[i].date}}
  return null;
}
const e1rm=(kg,reps,rir)=>kg*(1+(reps+Math.min(5,rir??2))/30); // Эпли с учётом запаса; RIR не записан → считаем 2
function nextSet(key,kg,reps,rir,E){ // E — лучшая оценка силы по этому и следующим подходам (они делались уставшим, так что оценка не завышена)
  const ex=EX[key];
  if(ex.time){
    if(reps==null)return{kg:null,reps:ex.lo,kind:"new"};
    if(reps>=ex.hi)return{kg:null,reps,kind:"top"};
    return{kg:null,reps:Math.min(ex.hi,reps+ex.step),kind:"reps"};
  }
  const R=ex.res??1; // держать в запасе не меньше R повторов
  if(reps==null)return{kg,reps:ex.lo,kind:"new"};
  if(rir!=null&&rir<=R-1)return{kg,reps,kind:"hold"};
  if(reps>=ex.hi&&kg!=null){
    const nk=Math.round((kg+ex.step)*100)/100;
    const est=kg>0&&!ex.bw?Math.round(30*(Math.max(E||0,e1rm(kg,reps,rir))/nk-1))-(R+1):ex.lo;
    return{kg:nk,reps:Math.max(Math.ceil(ex.lo/2),Math.min(ex.hi,est)),kind:"up"};
  }
  const nr=reps<ex.hi?Math.min(ex.hi,reps+(rir!=null&&rir>=R+2?2:1)):reps+1;
  return{kg,reps:nr,kind:nr-reps>=2?"easy":"reps"};
}
function plan(key,skipId){ // {date,label,note,prev:[{kg,reps,rir}],tg:[{kg,reps,kind}]} или null, если записей нет
  const L=lastFor(key,skipId);if(!L)return null;const ex=EX[key];
  const prev=L.e.sets.map(x=>({kg:ex.time?null:num(x.kg),reps:num(x.reps),rir:String(x.rir??"").trim()}));
  const base=prev.map((p,i)=>{if(p.reps!=null)return{...p,rn:rirNum(p.rir)};
    const o=olderSet(key,L.s,L.i,i,p.kg);return o?{kg:p.kg,reps:num(o.reps),rn:rirNum(o.rir),src:o}:{...p,rn:null}});
  const E=base.map((_,i)=>Math.max(0,...base.slice(i).filter(b=>!ex.time&&b.kg>0&&b.reps!=null).map(b=>e1rm(b.kg,b.reps,b.rn))));
  const tg=base.map((b,i)=>Object.assign(nextSet(key,b.kg,b.reps,b.rn,ex.bw?0:E[i]),b.src?{src:b.src}:{}));
  return{date:L.w.date,label:L.e.label||"",note:L.e.note||"",prev,tg};
}
function planWhy(key,P){ // пояснения только для особых случаев; обычный +1 повтор понятен и так
  const ex=EX[key],R=ex.res??1,out=[];const by=k=>P.tg.map((t,i)=>t.kind===k?i+1:0).filter(Boolean);const w=n=>(n.length>1?"Подходы ":"Подход ")+n.join(", ")+": ";
  P.tg.forEach((t,i)=>{if(t.src)out.push(`Подход ${i+1}: повторы не записаны — цель по записи ${fdate(t.src.date)} (${setTxt(key,num(t.src.kg),num(t.src.reps))}).`)});
  let n=by("up");if(n.length)out.push(w(n)+`дошёл до ${ex.hi} — вес выше. Дальше снова по +1 повтору.`);
  n=by("top");if(n.length)out.push(w(n)+`уже ${ex.hi} с — пора усложнить (блин или сложнее вариант).`);
  n=by("hold");if(n.length)out.push(w(n)+(R>1?`в прошлый раз в запасе было меньше ${R} повторов — повтори то же.`:"в прошлый раз был отказ — повтори то же, без прибавки."));
  n=by("easy");if(n.length)out.push(w(n)+`было легко (RIR ${R>1?"3+":"3 или 3+"}) — +2 повтора.`);
  n=by("new");if(n.length)out.push(w(n)+"повторы не записаны — цель с низа диапазона.");
  return out;
}

function exportObj(){return{app:"gym-log",version:1,exportedAt:new Date().toISOString(),workouts:S.workouts,deleted:S.deleted}}
function merge(remote){
  let added=0,updated=0,removed=0;
  const byId=new Map(S.workouts.map(w=>[w.id,w]));
  for(const [id,ts] of Object.entries(remote.deleted||{})){
    if(!S.deleted[id]||S.deleted[id]<ts)S.deleted[id]=ts;
    const w=byId.get(id);if(w&&(w.updated||0)<=ts){byId.delete(id);removed++}
  }
  for(const w of remote.workouts||[]){
    if(!w||!w.id||!w.date||!Array.isArray(w.entries))continue;
    if(S.deleted[w.id]&&S.deleted[w.id]>=(w.updated||0))continue;
    const l=byId.get(w.id);
    if(!l){byId.set(w.id,w);added++}else if((w.updated||0)>(l.updated||0)){byId.set(w.id,w);updated++}
  }
  S.workouts=[...byId.values()];
  return{added,updated,removed};
}
function needBackup(){
  if(TOKEN&&S.meta.gistId&&!S.meta.dirty)return false;
  const last=Math.max(S.meta.lastBackup||0,TOKEN?(S.meta.lastSync||0):0);
  return !last||Date.now()-last>7*86400000;
}
async function exportFile(){
  const text=JSON.stringify(exportObj());
  const name=`gym-log-${today()}.json`;
  const file=new File([text],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});S.meta.lastBackup=Date.now();await persist();return"Копия отправлена. Проверь, что файл сохранился в «Файлах» или в чате."}
    catch(e){if(e&&e.name==="AbortError")return null;}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  S.meta.lastBackup=Date.now();await persist();return"Файл копии создан.";
}
async function importText(text){
  let obj;try{obj=JSON.parse(text)}catch(e){throw new Error("Это не файл копии дневника.")}
  if(!obj||!Array.isArray(obj.workouts))throw new Error("В файле нет тренировок.");
  const r=merge(obj);markDirty();await persist();syncSoon();return r;
}

/* ---------- Облачная копия: секретный Gist на GitHub ---------- */
let syncing=false,syncTimer=null;
async function gh(path,opts={}){
  const r=await fetch("https://api.github.com"+path,{...opts,cache:"no-store",headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+TOKEN,"X-GitHub-Api-Version":"2022-11-28",...(opts.body?{"Content-Type":"application/json"}:{})}});
  if(!r.ok){const e=new Error("http "+r.status);e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
async function gistContent(g){
  const f=g.files&&g.files[GIST_FILE];if(!f)return null;
  if(f.truncated&&f.raw_url){const r=await fetch(f.raw_url,{cache:"no-store"});return r.text()}
  return f.content;
}
async function findGist(){
  for(let page=1;page<=5;page++){const list=await gh(`/gists?per_page=100&page=${page}`);const g=list.find(x=>x.description===GIST_DESC&&x.files&&x.files[GIST_FILE]);if(g)return g.id;if(list.length<100)break}
  return null;
}
async function syncNow(manual){
  if(!TOKEN||syncing)return;
  if(!navigator.onLine){if(manual)throw new Error("Нет интернета. Копия уйдёт сама, когда он появится.");return}
  syncing=true;
  try{
    if(!S.meta.gistId)S.meta.gistId=await findGist();
    if(S.meta.gistId){
      let g;try{g=await gh("/gists/"+S.meta.gistId)}catch(e){if(e.status===404){S.meta.gistId=null}else throw e}
      if(g){const txt=await gistContent(g);if(txt){try{merge(JSON.parse(txt))}catch(e){}}}
    }
    const body={files:{[GIST_FILE]:{content:JSON.stringify(exportObj())}}};
    if(S.meta.gistId)await gh("/gists/"+S.meta.gistId,{method:"PATCH",body:JSON.stringify(body)});
    else{const g=await gh("/gists",{method:"POST",body:JSON.stringify({description:GIST_DESC,public:false,...body})});S.meta.gistId=g.id}
    S.meta.dirty=false;S.meta.lastSync=Date.now();S.meta.syncError=null;
  }catch(e){
    S.meta.syncError=e.status===401?"Токен не подходит или истёк. Создай новый.":e.status===403||e.status===404?"У токена нет доступа к Gist.":"Не получилось отправить, повторю позже.";
    if(manual){await persist();throw new Error(S.meta.syncError)}
  }finally{syncing=false;await persist();if(tab==="log"){renderStats();showTop()}else if(tab!=="data"||!manual)renderAll()}
}
function syncSoon(){clearTimeout(syncTimer);if(TOKEN)syncTimer=setTimeout(()=>syncNow(false),1500)}
function markDirty(){S.meta.dirty=true}

function niceTicks(lo,hi,n=4){if(lo===hi){lo-=1;hi+=1}const raw=(hi-lo)/n;const p=Math.pow(10,Math.floor(Math.log10(raw)));const step=[1,2,2.5,5,10].map(m=>m*p).find(s=>s>=raw);const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step;const t=[];for(let v=a;v<=b+1e-9;v+=step)t.push(+v.toFixed(4));return t}

}
const setsHtml=(k,sets,long)=>sets.map(x=>`<span class="st">${EX[k].time?`${fmt(x.reps)} с`:long?`${x.kg==null?"?":fmt(x.kg)} кг × ${fmt(x.reps)}`:setTxt(k,x.kg,x.reps)}${x.rir?` <small>${esc(rirTxt(x.rir))}</small>`:""}</span>`).join("");
function exView(k,ctx){ // {chart, hist}: итоги, график и выбранная тренировка + карточка со всеми записями
  const ex=EX[k],rows=exSeries(k);
  if(!rows.length)return{chart:`<div class="empty">Записей пока нет. Сохрани тренировку с этим упражнением — здесь появятся график и все подходы.</div>`,hist:""};
  const ms=metricsFor(k),m=ms.includes(exMetric)?exMetric:ms[0],pts=exPoints(rows,m),u=mUnit(m);
  const seg=ms.length>1?`<div class="seg sm" role="group" aria-label="Что показать">${ms.map(x=>`<button type="button" data-metric="${x}" aria-pressed="${x===m}">${MN[x]}</button>`).join("")}</div>`:"";
  let chart=seg;
  if(!pts.length)chart+=`<div class="empty">Нет подходов с весом.</div>`;
  else{
    const last=pts[pts.length-1],best=pts.reduce((a,p)=>p.y>a.y+1e-9?p:a,pts[0]);
    let base=null;pts.forEach(p=>{if(p.t<=last.t-28*DAY)base=p});const lbl=base?"За месяц":"С "+fdate(pts[0].r.date);if(!base)base=pts[0];
    const dv=base!==last?last.y-base.y:null;
    const dTxt=dv==null?"—":Math.abs(dv)<0.05?"±0"+u:(dv>0?"+":"−")+mNum(m,Math.abs(dv))+u;
    const pct=dv==null?"нужна ещё запись":base.y>0&&(m==="e1"||m==="kg")&&Math.abs(dv)>=0.05?`${dv>0?"+":"−"}${Math.abs(Math.round(dv/base.y*100))} %`:"";
    const si=sel[ctx]!=null&&sel[ctx]<pts.length?sel[ctx]:null,p=pts[si??pts.length-1];
    const hint={e1:"Сила — оценка, сколько ты поднял бы на 1 раз, по лучшему подходу: вес, повторы и запас (формула Эпли). Растёт и от веса, и от повторов, поэтому прогресс видно, даже когда вес тот же.",
      kg:"Самый тяжёлый подход за тренировку. Вес растёт ступеньками, а между ними прибавляются повторы.",
      reps:"Лучший подход по повторам. Когда начнёшь добавлять вес, смотри «Рабочий вес».",
      time:"Самое долгое удержание за тренировку."}[m]+(ex.per?" Вес одной гантели.":"")+(m==="e1"||m==="kg"?" Если линия стоит больше 3–4 недель — добавь еды и сна.":"");
    chart+=`<div class="stats in">
      <div class="stat"><span class="label">Сейчас</span><b class="num">${mNum(m,last.y)}${u}</b><small>${fdate(last.r.date)}</small></div>
      <div class="stat"><span class="label">Рекорд</span><b class="num">${mNum(m,best.y)}${u}</b><small>${fdate(best.r.date)}</small></div>
      <div class="stat"><span class="label">${lbl}</span><b class="num${dv>=0.05?" up":""}">${dTxt}</b><small>${pct||"&nbsp;"}</small></div></div>
    ${lineChart(pts,u,{pr:true,sel:si,tap:ctx,fmt:m==="e1"?f1:fmt,label:MN[m]+": "+ex.name})}
    ${pts.length>1?`<div class="legend small"><span><i class="lg pr"></i>новый рекорд</span><span>нажми на график — покажу подходы</span></div>`:""}
    <div class="readout"><div class="rh"><b>${si==null?"Последняя · ":""}${fdate(p.r.date)}</b>${yr(p.r.date)}${p.r.w.day?` <span class="tag">День ${p.r.w.day}</span>`:""}${p.pr?` <span class="tag go">рекорд</span>`:""}</div>
      <div class="s num">${setsHtml(k,p.r.sets)}</div>
      ${m==="e1"?`<div class="small">Сила ≈ ${f1(p.y)} кг — по подходу ${setTxt(k,p.best.kg,p.best.reps)}${p.best.rn==null?" (RIR не записан — считаю 2)":""}</div>`:""}
      ${p.r.label||p.r.note?`<div class="note">${esc([p.r.label,p.r.note].filter(Boolean).join(" · "))}</div>`:""}</div>
    <div class="hint">${hint}</div>`;
  }
  const by=new Map(pts.map(p=>[p.r,p]));let prev=null;
  const items=rows.map(r=>{const p=by.get(r)||null,d=p&&prev?p.y-prev.y:null;if(p)prev=p;return{r,p,d}}).reverse();
  const hist=`<div class="card stack"><div class="dayhead"><h2>Все записи</h2><span class="hint">${rows.length} ${plural(rows.length,"тренировка","тренировки","тренировок")}</span></div>
    <ul class="exh">${items.map(({r,p,d})=>`<li><div class="hh"><span><b>${fdate(r.date)}</b>${yr(r.date)}${r.w.day?` <span class="tag">День ${r.w.day}</span>`:""}</span>
      <span class="hv num">${p?(m==="e1"?"≈ ":"")+mNum(m,p.y)+u:""}${d!=null&&Math.abs(d)>=0.05?` <small class="dlt ${d>0?"up":"down"}">${d>0?"+":"−"}${mNum(m,Math.abs(d))}</small>`:""}${p&&p.pr?` <span class="tag go">рекорд</span>`:""}</span></div>
      <div class="s num">${setsHtml(k,r.sets,true)}</div>
      ${r.label||r.note?`<div class="note">${esc([r.label,r.note].filter(Boolean).join(" · "))}</div>`:""}</li>`).join("")}</ul></div>`;
  return{chart,hist};
}
function nearestPt(svg,e){ // какую точку нажали: ближайшую по горизонтали
  const xs=(svg.dataset.xs||"").split(",").filter(Boolean).map(Number);if(!xs.length)return null;
  const r=svg.getBoundingClientRect();if(!r.width)return null;const vx=(e.clientX-r.left)/r.width*600;let bi=0;
  xs.forEach((x,i)=>{if(Math.abs(x-vx)<Math.abs(xs[bi]-vx))bi=i});return bi;
}
function bwCard(){ // вес тела: точки, пунктир цели +1 кг/мес за последние 6 недель, темп — по прямой через точки (наименьшие квадраты)
  const pts=sorted().filter(w=>num(w.bw)!=null).map(w=>({t:tsOf(w.date),y:num(w.bw),date:w.date}));
  const last=pts[pts.length-1],win=last?pts.filter(p=>p.t>=last.t-42*DAY):[];
  let pace=null;
  if(win.length>=3&&last.t-win[0].t>=14*DAY){const n=win.length,mt=win.reduce((a,p)=>a+p.t,0)/n,my=win.reduce((a,p)=>a+p.y,0)/n;
    const sxx=win.reduce((a,p)=>a+(p.t-mt)**2,0);if(sxx>0)pace=win.reduce((a,p)=>a+(p.t-mt)*(p.y-my),0)/sxx*DAY*30.44}
  const goal=win.length>=2&&last.t>win[0].t?[{t:win[0].t,y:win[0].y},{t:last.t,y:win[0].y+(last.t-win[0].t)/DAY/30.44}]:null;
  const sg=v=>(v>=0?"+":"−")+f1(Math.abs(v));
  const V=pace==null?{c:"",t:"Мало данных: взвешивайся хотя бы раз в неделю — тогда посчитаю темп."}:
    pace<0?{c:"warn",t:`Вес падает: ${sg(pace)} кг в месяц. Добавь ~300–500 ккал в день — например, ещё один приём пищи.`}:
    pace<0.5?{c:"warn",t:`Медленно: ${sg(pace)} кг в месяц. Добавь ~200–300 ккал в день — например, перекус.`}:
    pace<=2?{c:"ok",t:`В графике: ${sg(pace)} кг в месяц.`}:
    {c:"ok",t:`Быстрее цели: ${sg(pace)} кг в месяц. В начале это нормально; если растёт живот — чуть меньше еды.`};
  const si=sel.bw!=null&&sel.bw<pts.length?sel.bw:null,p=si!=null?pts[si]:last;
  return`<div class="card stack"><div class="dayhead"><h2>Вес тела</h2><span class="hint">цель ≈ +1 кг в месяц</span></div>
    ${pts.length>=2?`<div class="pace ${V.c}"><b>${pace==null?"Темп":"Темп с "+fdate(win[0].date)}</b><span>${V.t}</span></div>`:""}
    ${lineChart(pts," кг",{goal,sel:si,tap:"bw",label:"Вес тела"})}
    ${pts.length>=2?`<div class="legend small">${goal?`<span><i class="lg goal"></i>цель от ${fdate(win[0].date)}</span>`:""}<span>${si==null?"последнее ":""}${fdate(p.date)}: <b>${fmt(p.y)} кг</b></span></div>
    <div class="hint">Взвешивайся в одно время, лучше утром до еды. Вес скачет ±1 кг от еды и воды — смотри на темп, а не на одну точку.</div>`:""}</div>`;
}
function renderGraph(){
  const used=usedEx();if(!used.includes(graphEx)&&used.length)graphEx=used[0];
  const inP=new Set([...DAYS.A,...DAYS.B]);
  const opts=[["День A",DAYS.A],["День B",DAYS.B],["Не в программе",Object.keys(EX).filter(k=>!inP.has(k))]].map(([g,ks])=>{const u=ks.filter(k=>used.includes(k));
    return u.length?`<optgroup label="${g}">${u.map(k=>`<option value="${k}"${k===graphEx?" selected":""}>${esc(EX[k].name)}</option>`).join("")}</optgroup>`:""}).join("");
  const V=used.length?exView(graphEx,"graph"):null;
  $("#v-graph").innerHTML=bwCard()+`<div class="card stack"><h2>Прогресс в упражнении</h2>
    ${V?`<select id="g-ex" aria-label="Упражнение">${opts}</select>${V.chart}`:`<div class="empty">Запиши первую тренировку — здесь появится прогресс.</div>`}</div>${V?V.hist:""}`;
}
function renderSheet(){ // окно упражнения: открывается нажатием на название в «Программе», «Записать» и «Истории»
  if(!sheetEx)return;const k=sheetEx,ex=EX[k],V=exView(k,"sheet"),d=DAYS.A.includes(k)?"A":DAYS.B.includes(k)?"B":null;
  $("#sheet-ttl").textContent=ex.name;
  $("#sheet-body").innerHTML=`<div class="small">${d?`День ${d} · ${ex.sets||3} подхода · `:"Не в программе · "}${ex.lo}–${ex.hi} ${ex.time?"сек":"повт"}${ex.per?" · вес одной гантели":""}</div>
    <div class="card stack">${V.chart}</div>${V.hist}`;
}
function openEx(k){
  if(!EX[k])return;const a=document.activeElement;if(a&&a.tagName==="INPUT")a.blur();
  sheetEx=k;sel.sheet=null;renderSheet();const sh=$("#sheet");sh.hidden=false;sh.scrollTop=0;

function closeEx(){sheetEx=null;$("#sheet").hidden=true}
function renderData(msg,isErr){
  const lastCopy=Math.max(S.meta.lastBackup||0,TOKEN?(S.meta.lastSync||0):0);
  const cloud=!!(TOKEN&&S.meta.gistId);
  $("#v-data").innerHTML=`
  <div class="alert ${needBackup()?"":"ok"}"><b>${needBackup()?"Копия устарела":"Данные под защитой"}</b>
    <span>${cloud?(S.meta.dirty?"Есть изменения, которые ещё не в облаке. Уйдут сами, когда появится интернет.":"Облачная копия актуальна."):"Последняя копия файлом: "+ago(S.meta.lastBackup)+"."}</span></div>
  <div class="card stack"><h2>Где хранятся записи</h2>
    <dl class="kv">
      <dt>На этом телефоне</dt><dd>${S.workouts.length} тренировок</dd>

      <dt>Режим</dt><dd>${standalone()?"приложение с экрана «Домой»":"вкладка Safari"}</dd>

    <label class="secondary" style="text-align:center;display:block">Восстановить из файла<input id="imp" type="file" accept="application/json,.json" hidden></label>

    :`<div class="small">Копия будет обновляться сама, без твоих действий. Нужен токен GitHub с доступом только к Gist:
      <ol><li>github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li>
      <li>Expiration: выбери самый долгий срок. Account permissions → Gists: Read and write. Остальное не трогай.</li>
      <li>Скопируй токен и вставь ниже.</li></ol></div>
      <input id="tok" type="password" autocomplete="off" placeholder="github_pat_…" aria-label="Токен GitHub">
      <button class="primary" id="link" type="button">Подключить</button>`}
  </div>
  <div class="toast ${isErr?"err":""}" role="status">${esc(msg||"")}</div>
  <div class="small" style="text-align:center">Версия ${APP_VERSION}. Не удаляй иконку с экрана «Домой»: вместе с ней iOS стирает данные приложения.</div>`;
}
function renderAll(){
  if(!S)return;renderStats();showTop();
  ["prog","log","hist","graph","data"].forEach(t=>{$("#v-"+t).hidden=t!==tab});
  ({prog:renderProg,log:()=>renderLog(),hist:renderHist,graph:renderGraph,data:()=>renderData()})[tab]();

function go(t){readDraft();tab=t;confirmDel=null;sel.graph=sel.bw=null;document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.t===t));renderAll();window.scrollTo(0,0)}

  if(e.target.closest(".addset")){readDraft();const k=e.target.closest(".exlog").dataset.ex;const arr=draft.ex[k];
    const P=plan(k,draft.editId);const used=arr.map((s,i)=>s.ref===undefined?i:s.ref).filter(x=>x!=null);const r=used.length?Math.max(...used)+1:0;const t=P&&P.tg[r];
    arr.push({kg:t&&!EX[k].time?kgIn(t.kg):(arr[arr.length-1]||{}).kg||"",reps:"",rir:"",ref:t?r:null});S.draft=draft;persist();renderLog();return}

(async()=>{
